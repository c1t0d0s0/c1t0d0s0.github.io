<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sparkleGrad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF875" />
      <stop offset="35%" stop-color="#FFCC00" />
      <stop offset="75%" stop-color="#FF8E00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    
    <linearGradient id="sparkleGrad2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="40%" stop-color="#FFD500" />
      <stop offset="85%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#F5511E" />
    </linearGradient>

    <linearGradient id="sparkleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="45%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <radialGradient id="sparkleCore" cx="38%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FFF9C4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFD54F" stop-opacity="0" />
    </radialGradient>

    <filter id="sparkleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4A1E00" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#sparkleShadow)">
    <!-- 1. Main Large Sparkle -->
    <path d="M 205.00 95.00 C 205.00 247.10, 244.60 290.00, 385.00 290.00 C 244.60 290.00, 205.00 332.90, 205.00 485.00 C 205.00 332.90, 165.40 290.00, 25.00 290.00 C 165.40 290.00, 205.00 247.10, 205.00 95.00 Z" fill="url(#sparkleGrad1)" />
    <circle cx="205" cy="290" r="50" fill="url(#sparkleCore)" />

    <!-- 2. Top Right Secondary Sparkle -->
    <path d="M 375.00 15.00 C 375.00 112.50, 400.30 140.00, 490.00 140.00 C 400.30 140.00, 375.00 167.50, 375.00 265.00 C 375.00 167.50, 349.70 140.00, 260.00 140.00 C 349.70 140.00, 375.00 112.50, 375.00 15.00 Z" fill="url(#sparkleGrad2)" />
    <circle cx="375" cy="140" r="32" fill="url(#sparkleCore)" />

    <!-- 3. Bottom Left Small Sparkle -->
    <path d="M 85.00 340.00 C 85.00 397.00, 101.32 415.00, 153.00 415.00 C 101.32 415.00, 85.00 433.00, 85.00 490.00 C 85.00 433.00, 68.68 415.00, 17.00 415.00 C 68.68 415.00, 85.00 397.00, 85.00 340.00 Z" fill="url(#sparkleGrad3)" />
    <circle cx="85" cy="415" r="18" fill="url(#sparkleCore)" />
  </g>
</svg>
