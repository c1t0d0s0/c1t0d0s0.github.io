name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Firebase settings for study.html (Google login + progress board).
      # Written only when all four repository variables exist; otherwise study.html works without login.
      - name: Generate config.js
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_AUTH_DOMAIN" ] && [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_APP_ID" ]; then
            {
              echo "const FIREBASE_API_KEY = '$FIREBASE_API_KEY';"
              echo "const FIREBASE_AUTH_DOMAIN = '$FIREBASE_AUTH_DOMAIN';"
              echo "const FIREBASE_PROJECT_ID = '$FIREBASE_PROJECT_ID';"
              echo "const FIREBASE_APP_ID = '$FIREBASE_APP_ID';"
            } > config.js
            echo "config.js generated"
          else
            echo "FIREBASE_* variables not set; skipping config.js"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
